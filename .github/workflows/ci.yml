name: URL_Shortner CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  #Use an existing GitHub Action called checkout, version 4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic psycopg[binary] pytest httpx ruff

      - name: Run Ruff  #Ruff is a Python linter. It checks your code for things like:- syntax/problematic code patterns
        working-directory: Backend
        run: ruff check .

      - name: Run tests
        working-directory: Backend
        run: pytest

